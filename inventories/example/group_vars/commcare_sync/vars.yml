---

public_host: commcare-sync.example.com
ssl_enabled: true

# Set to true when an upstream proxy always terminates HTTPS in front of nginx
# and forwards X-Forwarded-Proto. Enables Django's SECURE_PROXY_SSL_HEADER and
# the corresponding nginx header pass-through. Only safe when gunicorn is not
# directly reachable from clients, otherwise the header can be spoofed.
uses_proxy_always: true

superset_enabled: true
superset_public_host: superset.example.com

app_user: "{{ ansible_user }}"

# Enable this if backup is required
postgresql_backup_enabled: false
# Add any other DBs separated with spaces
postgresql_backup_db_list: "superset"
postgresql_backups_to_keep: 5 # 0 will ignore this setting
