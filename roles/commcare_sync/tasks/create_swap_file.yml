---
- name: Create swap file
  ansible.builtin.command:
    cmd: dd if=/dev/zero of={{ swap_file }} bs=1024 count={{ swap_file_size_kb }}k
    creates: "{{ swap_file }}"
  tags: swap.file.create

- name: Change swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"
  tags: swap.file.permissions

- name: Check swap file type
  ansible.builtin.command: file {{ swap_file }}
  register: swapfile
  tags: swap.file.mkswap
  changed_when: false

- name: Make swap file
  ansible.builtin.command: "mkswap {{ swap_file }}"
  when: swapfile.stdout.find('swap file') == -1
  changed_when: true
  tags: swap.file.mkswap

- name: Write swap entry in fstab
  ansible.posix.mount:
    name: none
    src: "{{ swap_file }}"
    fstype: swap
    opts: sw
    passno: 0
    dump: 0
    state: present
  tags: swap.fstab

- name: Mount swap
  ansible.builtin.command: "swapon {{ swap_file }}"
  when: ansible_swaptotal_mb < 1
  changed_when: ansible_swaptotal_mb < 1
  tags: swap.file.swapon
