---

- name: Test
  command: echo it works!
  tags:
    - always

# Swap

- include_tasks: create_swap_file.yml
  when: swap_file_enabled
  tags:
    - provision
    - swap


# Packages

- name: Install security updates.
  apt:
    default_release: "{{ ansible_distribution_release }}-security"
    update_cache: "{{ apt_update_cache }}"
    upgrade: dist
  tags:
    - provision
    - packages
    - packages.security
    - skip_ansible_lint
  when: env != 'dev'

- name: Install base packages.
  apt:
    name:
      - locales
      - build-essential
      - acl
      - ntp
      - htop
      - git
      - vim
      - screen
      - curl
      - "{{ base_python_package }}-pip"
      - "i{{ base_python_package }}"
      - supervisor
      - libpq-dev
    update_cache: "{{ apt_update_cache }}"
    state: present
  tags:
    - provision
    - packages
    - skip_ansible_lint


# Python

- include_tasks: python.yml
  tags:
    - provision
    - python


# Users & Groups

- name: Create the app group.
  group:
    name: "{{ app_group }}"
    system: yes
    state: present
  tags:
    - provision
    - users

- name: Create the app user.
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /bin/bash
    state: present
  tags:
    - provision
    - users

- name: Create {{ base_dir }} folder.
  file:
    path: "{{ base_dir }}"
    group: "{{ app_group }}"
    mode: 0755
    state: directory
  tags:
    - provision
    - users

- name: Create user .bash_aliases file.
  template:
    src: system/bash_aliases_script.sh.j2
    dest: "{{ home_dir }}/.bash_aliases"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: 0740
    backup: yes
  tags:
    - deploy
    - users






# logging

- include_tasks: logrotate.yml
  tags:
    - provision
    - logging

- include_tasks: pg_backup.yml
  tags:
    - provision
    - postgres_backup
  when: postgresql_backup_enabled

...
