---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install sudo and python3
      ansible.builtin.raw: apt-get update && apt-get install -y sudo python3
      changed_when: false

- name: Install required packages
  hosts: all
  become: true
  tasks:
    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-apt
          - curl
          - gnupg2
          - lsb-release
          - ca-certificates
          - locales
          - systemd
        state: present
