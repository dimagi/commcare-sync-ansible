---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check if Redis is running
      command: pgrep redis-server
      register: redis_process
      changed_when: false

    - name: Assert Redis process is running
      assert:
        that: redis_process.rc == 0
        fail_msg: "Redis process is not running"

    - name: Check if Redis is listening on port 6379
      wait_for:
        port: 6379
        timeout: 5
      register: redis_port

    - name: Assert Redis is listening
      assert:
        that: redis_port.state == 'started'
        fail_msg: "Redis is not listening on port 6379"
